<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sorting Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Text&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #138235;
            color: #0b5d37;
            font-family: 'Crimson Text', serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3em;
            color: #30531c;
            margin-bottom: 20px;
        }

        .question {
            font-size: 1.5em;
            margin: 20px 0;
        }

        button {
            background-color: #00ff0075;
            color: rgb(26, 82, 18);
            padding: 12px 35px;
            margin: 10px;
            font-size: 1em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cinzel Decorative', cursive;
            transition: 0.3s ease;
        }

        button:hover {
            background-color: #59ea45;
        }

        .house-btns {
            margin-top: 40px;
        }

        .house-btn {
            background-color: #227a2e;
            padding: 12px 25px;
            margin: 5px;
            font-size: 1em;
            border: none;
            border-radius: 30px;
            color: #ffecb3;
            font-family: 'Cinzel Decorative', cursive;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .house-btn:hover {
            background-color: #3e2723;
        }
    </style>
</head>

<body>

    <h1>The Sorting Hat Quiz 🧙‍♂️</h1>

    <audio autoplay loop>
        <source src="https://audio.jukehost.co.uk/QdcFguq09Skdu7nCjRKme47kl0Sks4sE" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="quiz">
        <div class="question" id="question-text"></div>
        <div id="answers"></div>
    </div>

    <div id="result" style="display:none;">
        <h2>You belong in <span id="house-name"></span>! 🏰</h2>

        <div class="house-btns">
            <button class="house-btn" onclick="visitHouse('Gryffindor')">Visit Gryffindor 🦁</button><a href="Gryffindor.html"></a>
            <button class="house-btn" onclick="visitHouse('Slytherin')">Visit Slytherin 🐍</button><a href="Slytherin.html"></a>
            <button class="house-btn" onclick="visitHouse('Ravenclaw')">Visit Ravenclaw 🦅</button><a href="Ranvenclaw.html"></a>
            <button class="house-btn" onclick="visitHouse('Hufflepuff')">Visit Hufflepuff 🦡</button><a href="Gryffindor.html"></a>.html"></a>
        </div>
    </div>

    <script>
        const questions = [
            {
                text: "You see someone being bullied. What do you do?",
                answers: {
                    gryffindor: "Stand up to the bully immediately",
                    hufflepuff: "Comfort the victim and support them",
                    ravenclaw: "Find a clever way to stop it",
                    slytherin: "Use strategy to outsmart the bully later"
                }
            },
            {
                text: "Which magical subject sounds the coolest?",
                answers: {
                    ravenclaw: "Ancient Runes",
                    gryffindor: "Defense Against the Dark Arts",
                    slytherin: "Potions",
                    hufflepuff: "Care of Magical Creatures"
                }
            },
            {
                text: "Choose a magical object:",
                answers: {
                    gryffindor: "Sword of Gryffindor",
                    slytherin: "Salazar's Locket",
                    ravenclaw: "Rowena’s Diadem",
                    hufflepuff: "Helga’s Cup"
                }
            },
            {
                text: "What's your strongest trait?",
                answers: {
                    gryffindor: "Bravery",
                    slytherin: "Ambition",
                    ravenclaw: "Intelligence",
                    hufflepuff: "Loyalty"
                }
            }
        ];

        let currentQuestion = 0;
        let scores = {
            gryffindor: 0,
            slytherin: 0,
            ravenclaw: 0,
            hufflepuff: 0
        };

        function loadQuestion() {
            document.getElementById('question-text').innerText = questions[currentQuestion].text;
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = '';

            for (const house in questions[currentQuestion].answers) {
                const button = document.createElement('button');
                button.innerText = questions[currentQuestion].answers[house];
                button.onclick = () => {
                    scores[house]++;
                    nextQuestion();
                };
                answersDiv.appendChild(button);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showResult();
            } else {
                loadQuestion();
            }
        }

        function showResult() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            const house = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            document.getElementById('house-name').innerText = house.charAt(0).toUpperCase() + house.slice(1);
        }

        function visitHouse(house) {
            alert('Taking you to the ' + house.charAt(0).toUpperCase() + house.slice(1) + ' common room!');
            
        }

    
        loadQuestion();
    </script>

</body>

</html>
